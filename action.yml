name: Ygglet
description: >-
  Start a Ygglet Linux container, in which every binary is built with the rr software
  ticks plugin, and run the job's later steps in it with `shell: ygglet {0}`.
branding:
  icon: box
  color: green

inputs:
  image-url:
    description: >-
      The image: a root filesystem tarball (`.tar.zst`, `.tar.gz` or `.tar`), as written by
      `ygglet build`, as a URL or a local path. Default: the image in `image.env`, which this
      version of the action was published with.
    default: ''
  image-sha256:
    description: The image's sha256, required with `image-url` (`none` skips the check).
    default: ''
  name:
    description: The container's name, for more than one container or for `docker` itself.
    default: ygglet
  docker-options:
    description: >-
      More `docker run` options for the container, separated by whitespace (no quoting),
      e.g. `--memory 8g --env-file vars`.
    default: ''

outputs:
  container:
    description: The container's name.
    value: ${{ inputs.name }}
  image:
    description: The Docker image the container runs.
    value: ${{ steps.start.outputs.image }}

runs:
  using: composite
  steps:
    - id: start
      shell: bash
      env:
        YGGLET_IMAGE_URL: ${{ inputs.image-url }}
        YGGLET_IMAGE_SHA256: ${{ inputs.image-sha256 }}
        YGGLET_NAME: ${{ inputs.name }}
        YGGLET_DOCKER_OPTIONS: ${{ inputs.docker-options }}
      run: '"$GITHUB_ACTION_PATH/scripts/start.sh"'
